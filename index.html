<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
    
</head>

<body>
    <a href="pizzarendeles.html">Rendelj egy pizzát</a>
    <h1>Regisztráció</h1>

   
    <!-- GET METÓDUS - Ugyanarra az oldalra (#) küldi az adatokat, a böngésző címsorban -->
    <!-- <form action="#" method="get"> -->
    <!-- elküldi az adatokat a post metódussal -->
    <form action="https://httpbin.org/post" method="post">
        <p>
            <label for="nev">Teljes név:</label>
            <input type="text" name="nev" id="nev" placeholder="pl.: Vak Béla" required>
        </p>
        <p>
            <label for="email">E-mail cím:</label>
            <input type="email" name="email" id="email" placeholder="pl.: juhasz@gmail.com" required>
        </p>
        <p>
            <label for="phone-number">Telefonszám:</label>
            <input type="tel" name="phone-number" id="phone-number" minlength="12" maxlength="15"
                placeholder="+36701112233" required>
        </p>

        <p> 
        <label for="age">Életkor*</label>
        <input type="number" name="age" id="age" required min="0" max="120" step="1" placeholder="pl.: 25">
        </p>
        
        <p> Nem * <br>
            <label for="gender">Férfi</label>
            <input type="radio" name="gender" id="male" value="male">

            <label for="gender">Nő</label>
            <input type="radio" name="gender" id="female" value="female">
        </p>
        <!-- checkbox - többet lehet választani -->

        <p> Sportok  <br>
            <label for="sports">Foci</label>
            <input type="checkbox" name="sports" id="football" value="football">

            <label for="sports">Röplabda</label>
            <input type="checkbox" name="sports" id="volleyball" value="volleyball">
        </p>

        <p><small>a *-GAL  jelölt mezők kitöltése kötelező</small></p>
        <button type="submit">Regisztráció</button>

    </form>
</body>

</html>
